[project]
name = "opensearch-charms-single-kernel"
dynamic = ["version"]
description = "Shared and reusable code for OpenSearch charms"
readme = "README.md"
license = "Apache-2.0"
authors = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "ops (>=3.8.0,<4.0.0)",
  "tenacity (>=9.1.4,<10.0.0)",
  "boto3 (>=1.43.51,<2.0.0)",
  "overrides (>=7.7.0,<8.0.0)",
  "requests (>=2.34.2,<3.0.0)",
  "ruamel.yaml (>=0.19.1,<0.20.0)",
  "shortuuid (>=1.0.13,<2.0.0)",
  "pydantic (>=2.13.4,<3.0.0)",
  "cryptography (>=49.0.0,<50.0.0)",        # tls_certificates_interface/v3/tls_certificates.py
  "jsonschema (>=4.26.0,<5.0.0)",           # tls_certificates_interface/v3/tls_certificates.py
  "lightkube (>=0.22.0,<0.23.0)",           # Upgrades on k8s
  "data-platform-helpers (>=1.1.0,<2.0.0)",
  "poetry-core (>=1.9.0,<2.0.0)",
  "charmlibs-pathops (>=1.3.0.post0,<2.0.0)",
  "azure-storage-blob (>=12.30,<13.0.0)",
  "google-cloud-storage (>=2.19.0,<3.0.0)",
  "google-api-core (>=2.32.0,<3.0.0)",
  "cosl (>=1.10.1,<2.0.0)",                 # grafana_agent/v0/cos_agent.py, grafana_k8s/v0/grafana_dashboard.py, loki_k8s/v1/loki_push_api.py
  "bcrypt (>=4.3.0,<5.0.0)",                 # smtp_integrator/v0/smtp.py
  "email-validator (>=2.3.0,<3.0)",           # smtp_integrator/v0/smtp.py
  "urllib3 (>=2.7.0,<3.0.0)",
  "object-storage-charmlib (>=1.0.0,<2.0.0)",
]


[project.urls]
homepage = "https://github.com/canonical/opensearch-single-kernel-library"
repository = "https://github.com/canonical/opensearch-single-kernel-library"
"Bug Tracker" = "https://github.com/canonical/opensearch-single-kernel-library/issues"
"Matrix" = "https://matrix.to/#/#charmhub-data-platform:ubuntu.com"
"Contribute" = "https://github.com/canonical/opensearch-single-kernel-library/blob/main/CONTRIBUTING.md"


[tool.setuptools.packages.find]
where = ["."]
include = ["opensearch_single_kernel*"]
exclude = ["terraform*"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting and linting tools configuration
[tool.ruff]
target-version = "py310"
line-length = 99
exclude = [
  "opensearch_single_kernel/lib",
  "tests/charms/**/lib",
  "tests/integration/**/lib",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "N", "D", "I"]
ignore = ["E501", "D107", "D415", "D417", "N818"]
per-file-ignores = {"tests/*" = ["D100", "D101", "D102", "D103", "D104"]}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.codespell]
skip = "*.lock,single_kernel_opensearch_dashboards/lib,tests/charms/*/lib,tests/integration/*/lib"

[tool.poetry]
requires-poetry = ">=2.0.0"
package-mode = true
packages = [{ include = "opensearch_single_kernel" }]
include = ["opensearch_single_kernel/templates/"]
exclude = ["opensearch_single_kernel/charmcraft.yaml"]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10.0"
poetry-dynamic-versioning = { version = ">=1.10.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
dirty = true
strict = true
fix-shallow-repository = true



[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.15.20"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
codespell = "^2.4.2"
ruff = "^0.15.20"
tomli = {version = "^2.0.1", python = "<3.11"}


[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
pytest = "^9.1.1"
coverage = { extras = ["toml"], version = "^7.15.2" }
pytest-mock = "^3.15.1"
pytest-operator = "^0.43.2"
responses = "^0.26.1"
ops = { extras = ["testing"], version = "^3.8.0" }
ops-scenario = "^8.8.0"

[tool.poetry.group.integration.dependencies]
pytest = "^9.1.1"
juju = "^3.6.1.3"
coverage = { extras = ["toml"], version = "^7.15.2" }
pytest-asyncio = "^0.21.2"
pytest-operator = "^0.43.2"
allure-pytest = "^2.16.0"
allure-pytest-default-results = "^0.1.4"
pytest-playwright = "^0.8.0"
oauth_tools = { git = "https://github.com/canonical/iam-bundle", rev = "921d113325eed156e5b54f97c42e6c50810180c0" }
pyjwt = "^2.13.0"
# Avoid httpx-ws 0.9.0 importing anyio.AsyncContextManagerMixin, which is unavailable in
# the AnyIO version resolved for the integration environment (for oauth tests).
httpx-ws = ">=0.9.0,<0.10.0"
pytest-microceph = { git = "https://github.com/canonical/data-platform-workflows", tag = "v32.1.0", subdirectory = "python/pytest_plugins/microceph" }
pyyaml = "^6.0.2"
protobuf = "^6.31.1"
opensearch-py = "^2.8.0"
# Azure integration tests
azure-identity = "^1.23.0"

[build-system]
requires = ["poetry-core>=2.4.1", "poetry-dynamic-versioning>=1.10.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
