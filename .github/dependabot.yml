version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    commit-message:
      # Required by create-semantic-version-tag; must be breaking/compatible/patch
      prefix: "patch"
      prefix-development: "patch"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
    cooldown:
      default-days: 3
    groups:
      all-non-major:
        update-types:
          - "minor"
          - "patch"
