#
# Telegraf config fragment appended to .github/actions/ci-telemetry/telegraf.conf
# via the action's `extra-config` input. Adds the processes specific to this
# repository's integration tests, which the generic action does not know about.
#
# The base config already watches jujud, lxd, containerd, dockerd, snapd,
# kubelet, pebble, mongod, pytest and telegraf itself.
#
# Cost: this is a second process-table sweep, ~150 ms every 30 s (~0.5% of one
# core) on top of the base block. Verify with the internal_gather table:
#   jq -r '.metrics[]|select(.name=="internal_gather")
#          |"\(.tags.input) \(.fields.gather_time_ns)"' metrics.json

[[inputs.procstat]]
  interval = "30s"

  # java  — the OpenSearch workload itself, on both substrates:
  #         VM  : the `opensearch` snap's `daemon` service (/snap/opensearch/current)
  #         K8s : the pebble `opensearch` service inside the workload container
  #         LXD system containers and k8s pods share the host kernel, so these
  #         processes are visible in the runner's /proc.
  # k8sd, kube-*, cilium-agent — Canonical Kubernetes control plane
  #         (concierge-k8s.yaml provisions the k8s snap, 1.32-classic/stable,
  #         with the cilium-backed network feature).
  # concierge, charmcraft, spread — test orchestration; charmcraft packing in
  #         particular is long-running and disk/CPU heavy.
  pattern = "(^|/)java( |$)|(^|/)(k8sd|kube-apiserver|kube-controller-manager|kube-scheduler|kube-proxy|cilium-agent|concierge|charmcraft|spread)( |$)"

  # native: match in-process, no pgrep fork and no procps dependency
  pid_finder = "native"

  # procstat records full command lines by default. The bundle is a workflow
  # artifact readable by anyone who can read the repo, and the integration job
  # holds AWS/GCP/Azure credentials, so the field must not be collected.
  fielddrop = ["cmdline"]

  # the alternation above would otherwise be repeated as a tag on every document
  tagexclude = ["pattern"]
