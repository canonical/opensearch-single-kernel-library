name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  workflow_dispatch:
  workflow_call:
    secrets:
      CHARMHUB_TOKEN:
        required: true
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_KEY:
        required: true
      AZURE_STORAGE_ACCOUNT:
        required: true
      AZURE_SECRET_KEY:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true

permissions:
  contents: read

jobs:
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        # One call per base keeps each matrix under GitHub's 256 jobs limit
        base: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu22", "ubuntu24"]') || fromJSON('["ubuntu24"]') }}
    name: Integration | ${{ matrix.base }}
    uses: $/.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ""
      base: ${{ matrix.base }}
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_SECRET_KEY: ${{ secrets.AZURE_SECRET_KEY }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    permissions:
      contents: write # Needed for Allure Report
