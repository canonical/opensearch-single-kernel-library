name: Check pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - edited
    branches:
      - 2/edge
      - feature/single-kernel

jobs:
  check-pr:
    name: Check pull request
    uses: canonical/data-platform-workflows/.github/workflows/check_python_package_pr.yaml@v50.0.0
    permissions: {}
