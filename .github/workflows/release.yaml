name: Release to PyPI

on:
  push:
    branches:
      - 2/edge

concurrency:
  # Prevent race conditions (if multiple commits have been pushed since the last release)
  group: dpw-release-python-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_SECRET_KEY: ${{ secrets.AZURE_SECRET_KEY }}
      GCP_ACCESS_KEY: ${{ secrets.GCP_ACCESS_KEY }}
      GCP_SECRET_KEY: ${{ secrets.GCP_SECRET_KEY }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    permissions:
      pull-requests: write # Needed by lib-check job
      contents: write # Needed by integration-test job for Allure Report

  release-part1:
    needs:
      - ci
    name: Release to PyPI (part 1)
    uses: canonical/data-platform-workflows/.github/workflows/release_python_package_part1.yaml@v50.0.0
    permissions:
      contents: write # Needed to create git tag

  # Separate job needed to workaround https://github.com/pypi/warehouse/issues/11096
  release-trusted-publishing:
    name: Release to PyPI (trusted publishing)
    needs:
      - release-part1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release-part1.outputs.artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
    permissions:
      id-token: write # Needed for PyPI trusted publishing

  release-part2:
    name: Release to PyPI (part 2)
    needs:
      - release-part1
      - release-trusted-publishing
    uses: canonical/data-platform-workflows/.github/workflows/release_python_package_part2.yaml@v50.0.0
    with:
      git-tag: ${{ needs.release-part1.outputs.git-tag }}
    permissions:
      contents: write # Needed to create GitHub release

  wait-for-pypi-available:
    name: Wait for PyPI release to be available
    runs-on: ubuntu-latest
    needs:
      - release-part1
      - release-part2
    permissions: {}
    steps:
      - name: Wait for PyPI release to be available
        env:
          RELEASE_TAG: ${{ needs.release-part1.outputs.git-tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          DEP_NAME="opensearch-charms-single-kernel"
          VERSION_NUMBER="${TAG#v}"
          URL="https://pypi.org/pypi/${DEP_NAME}/${VERSION_NUMBER}/json"

          echo "Waiting for ${DEP_NAME}==${VERSION_NUMBER} to be available on PyPI..."
          for i in {1..30}; do
            if curl -fsS "$URL" >/dev/null; then
              echo "Found ${DEP_NAME}==${VERSION_NUMBER} on PyPI."
              exit 0
            fi
            echo "Not yet available (attempt $i/30). Sleeping..."
            sleep 60
          done

          echo "Timed out waiting for ${DEP_NAME}==${VERSION_NUMBER} on PyPI."
          exit 1

  trigger-bump-dependent-charms:
    name: Trigger bump-dependent-charms workflow
    needs:
      - release-part1
      - release-part2
      - wait-for-pypi-available
    uses: ./.github/workflows/bump_dependent_charms.yaml
    with:
      version: ${{ needs.release-part1.outputs.git-tag }}
      base_branch: ${{ github.ref_name }}
    secrets:
      PAT: ${{ secrets.PAT }}
      CI_COMMITS_SSH_SIGNING_KEY: ${{ secrets.CI_COMMITS_SSH_SIGNING_KEY }}
    permissions:
      contents: read
