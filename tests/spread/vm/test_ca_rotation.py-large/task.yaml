summary: test_ca_rotation.py
environment:
  TEST_MODULE: tls/test_ca_rotation.py
systems:
  - self-hosted-linux-amd64-noble-xlarge
  - self-hosted-linux-arm64-noble-xlarge
execute: |
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --substrate vm --alluredir="$SPREAD_TASK/allure-results" -m 'group(id="large")'
artifacts:
  - allure-results
