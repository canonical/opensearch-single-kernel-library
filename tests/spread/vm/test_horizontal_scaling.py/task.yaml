summary: test_horizontal_scaling.py
environment:
  TEST_MODULE: ha/test_horizontal_scaling.py
systems:
  - self-hosted-linux-amd64-noble-xlarge
execute: |
  juju switch concierge-lxd
  tox run -e integration -- "tests/integration/$TEST_MODULE" --substrate vm --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results
