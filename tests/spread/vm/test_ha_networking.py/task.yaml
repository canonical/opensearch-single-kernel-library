summary: test_ha_networking.py
environment:
  TEST_MODULE: ha/test_ha_networking.py
systems:
  - self-hosted-linux-amd64-noble-large
execute: |
  juju switch concierge-lxd
  tox run -e integration -- "tests/integration/$TEST_MODULE" --substrate vm --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results
