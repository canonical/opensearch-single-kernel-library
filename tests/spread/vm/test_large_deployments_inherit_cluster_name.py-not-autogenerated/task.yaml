summary: test_large_deployments_inherit_cluster_name.py
environment:
  TEST_MODULE: ha/test_large_deployments_inherit_cluster_name.py
systems:
  - ubuntu-24.04
  - ubuntu-24.04-arm
execute: |
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --substrate vm --alluredir="$SPREAD_TASK/allure-results" -m 'group(id="Cluster name not autogenerated")'
artifacts:
  - allure-results
