summary: test_relations_ldap.py
environment:
  TEST_MODULE: relations/test_ldap.py
systems:
  - self-hosted-linux-amd64-noble-xlarge
  # Authentik does not support arm64
  #- self-hosted-linux-arm64-noble-xlarge
execute: |
  tox run -e integration -- "tests/integration/$TEST_MODULE" --substrate vm --model testing --alluredir="$SPREAD_TASK/allure-results" -m 'group(id="authentik")'
artifacts:
  - allure-results
