summary: test_roles_management.py
environment:
  TEST_MODULE: ha/test_roles_management.py
systems:
  - self-hosted-linux-amd64-noble-xlarge
execute: |
  juju switch concierge-microk8s
  tox run -e integration -- "tests/integration/$TEST_MODULE" --substrate k8s --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results
