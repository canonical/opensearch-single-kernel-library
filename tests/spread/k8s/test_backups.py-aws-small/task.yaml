summary: test_backups.py
manual: true
environment:
  TEST_MODULE: ha/test_backup.py
systems:
  - self-hosted-linux-amd64-noble-large
execute: |
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --substrate k8s --alluredir="$SPREAD_TASK/allure-results" -m 'group(id="aws-small")'
artifacts:
  - allure-results
