summary: test_ca_rotation.py
environment:
  TEST_MODULE: tls/test_ca_rotation.py
systems:
  - self-hosted-linux-amd64-noble-large
execute: |
  juju switch concierge-microk8s
  tox run -e integration -- "tests/integration/$TEST_MODULE" --substrate k8s --model testing --alluredir="$SPREAD_TASK/allure-results" -m 'group(id="small")'
artifacts:
  - allure-results
