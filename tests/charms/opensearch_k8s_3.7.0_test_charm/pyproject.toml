[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting and linting tools configuration
[tool.ruff]
target-version = "py310"
line-length = 99
exclude = ["lib"]

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "N", "D", "I"]
ignore = ["E501", "D107", "D415", "N818"]
per-file-ignores = {"tests/*" = ["D100", "D101", "D102", "D103", "D104"]}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.poetry.dependencies]
python = "^3.10"
opensearch-charms-single-kernel = "*"
ops = "^3.8.1"
