[tox]
env_list = lint, unit

[vars]
src_path = {tox_root}/opensearch_single_kernel
tests_path = {tox_root}/tests
libs_path = {tox_root}/opensearch_single_kernel/lib/
tests_charms_path = {[vars]tests_path}/integration/relations/opensearch_provider/application-charm
tests_charms_path_v1 = {[vars]tests_path}/integration/relations/opensearch_provider/application-charm-v1
tests_charms_path_v1_data_interfaces = {[vars]tests_charms_path_v1}/lib/charms/data_platform_libs/v1/data_interfaces.py
all_path = {[vars]src_path} {[vars]tests_path}
lint_exclude = .git,*/.git/*,__pycache__,*/__pycache__/*,.tox,*/.tox/*,.venv,*/.venv/*,.ruff_cache,*/.ruff_cache/*,build,*/build/*,dist,*/dist/*,*.egg_info,venv,.coverage,*/.coverage,.codex,*/.codex,*.charm,{[vars]libs_path}*,{[vars]tests_charms_path}/*,{[vars]tests_charms_path_v1_data_interfaces}

[testenv]
set_env =
    # Put the repo root on PYTHONPATH
    PYTHONPATH = {tox_root}:{tox_root}/lib
    PY_COLORS = 1
    # Avoid accidentally reusing a system setuptools without pkg_resources
    PIP_IGNORE_INSTALLED = 1
allowlist_externals =
    poetry
    bash

[testenv:format]
description = Apply coding style standards to code
commands_pre =
    poetry install --only format
commands =
    poetry lock
    poetry run isort {[vars]all_path}
    poetry run black {[vars]all_path}

[testenv:build]
description = Builds the package
commands_pre =
    poetry install
commands =
    poetry lock
    poetry build


[testenv:lint]
description = Check code against coding style standards
allowlist_externals =
    {[testenv]allowlist_externals}
    find
commands_pre =
    poetry install --only lint
commands =
    poetry check --lock
    poetry run codespell {[vars]all_path}
    # pflake8 wrapper supports config from pyproject.toml
    poetry run pflake8 --exclude '{[vars]lint_exclude}' {[vars]all_path}
    poetry run isort --check-only --diff --skip {[vars]libs_path} --skip {[vars]tests_charms_path} --skip {[vars]tests_charms_path_v1_data_interfaces} --skip-glob '*/.tox/*' --skip-glob '*/.venv/*' --skip-glob '*/.ruff_cache/*' {[vars]all_path}
    poetry run black --check --diff {[vars]all_path} --extend-exclude '(/lib/charms/|/\.tox/|/\.venv/|/\.ruff_cache/|/tests/integration/relations/opensearch_provider/application-charm/|/tests/integration/relations/opensearch_provider/application-charm-v1/lib/charms/data_platform_libs/v1/data_interfaces\.py)'
    find {[vars]all_path} \( -path "*/.tox/*" -o -path "*/.venv/*" -o -path "*/.ruff_cache/*" -o -path "{[vars]libs_path}*" -o -path "{[vars]tests_charms_path}/*" -o -path "{[vars]tests_charms_path_v1_data_interfaces}" \) -prune -o -type f \( -name "*.sh" -o -name "*.bash" \) -exec poetry run shellcheck --color=always \{\} +

# Backward compatibility with default unit env
[testenv:unit]
description = Run unit tests
set_env =
    {[testenv]set_env}
commands_pre =
    poetry install --only main,charm-libs,unit
commands =
    poetry run coverage run --source={[vars]src_path} \
    -m pytest -v --tb native -s {posargs} {[vars]tests_path}/unit
    poetry run coverage report
    poetry run coverage xml

[testenv:unit-vm]
description = Run unit tests
set_env =
    {[testenv]set_env}
commands_pre =
    poetry install --only main,charm-libs,unit
commands =
    poetry run coverage run --source={[vars]src_path} \
    -m pytest -v --tb native -s {posargs} {[vars]tests_path}/unit --substrate vm
    poetry run coverage report
    poetry run coverage xml

[testenv:unit-k8s]
description = Run unit tests
set_env =
    {[testenv]set_env}
commands_pre =
    poetry install --only main,charm-libs,unit
commands =
    poetry run coverage run --source={[vars]src_path} \
    -m pytest -v --tb native -s {posargs} {[vars]tests_path}/unit --substrate k8s
    poetry run coverage report
    poetry run coverage xml

[testenv:integration]
description = Run integration tests
basePython = python3.12
pass_env =
    CI
    AWS_ACCESS_KEY
    AWS_SECRET_KEY
    GCP_ACCESS_KEY
    GCP_SECRET_KEY
    GCP_SERVICE_ACCOUNT
    AZURE_STORAGE_ACCOUNT
    AZURE_SECRET_KEY
    CHARM_UBUNTU_BASE
commands_pre =
    poetry install --only main,charm-libs,integration
commands =
    poetry run pytest -v --tb native --log-cli-level=INFO -s --ignore={[vars]tests_path}/unit/ {posargs}
